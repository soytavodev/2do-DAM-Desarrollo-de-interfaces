<article class="ju-toast is-{{tipo}}" role="status">
 <div class="ju-toast-icon">
  {{icono}}
 </div>
 <div>
  <p class="ju-toast-title">
   {{titulo}}
  </p>
  <p class="ju-toast-text">
   {{texto}}
  </p>
 </div>
 <button aria-label="Cerrar" class="ju-toast-close" type="button">
  ×
 </button>
</article>

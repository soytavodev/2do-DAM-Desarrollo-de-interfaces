<!DOCTYPE html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso · Gravelop</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/gravelop-iu.css">
</head>
<body>
  <div class="iu-login">
    <aside class="iu-login-lado">
      <a class="iu-marca" href="login.html">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="M73.0 30.7 A30 30 0 1 0 80 50" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="square"/>
          <path d="M52 50 H96" stroke="#AD7856" stroke-width="7"/>
          <circle cx="50" cy="50" r="5" fill="#D59A76"/>
      </svg>
        <strong>Gravelop</strong>
      </a>

      <div>
        <h1>Atraer. Crear.<br><b>Crecer.</b></h1>
        <p>Desarrollo web, apps y marketing digital para que tu negocio se vea.</p>
      </div>

      <small class="iu-tenue">Interfaz hecha con gravelop-iu · Proyecto de Desarrollo de interfaces · 2.º DAM · CEAC</small>
    </aside>

    <main class="iu-login-panel">
      <div class="iu-login-tarjeta">
        <h2>Iniciar sesión</h2>
        <p>Panel interno de Gravelop.</p>

        <form class="iu-form" id="formLogin" novalidate>
          <label class="iu-control" for="email">
            <span>Email<span class="iu-requerido" aria-hidden="true">*</span></span>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="Tu email" required aria-describedby="emailAyuda">
            <small class="iu-ayuda" id="emailAyuda"></small>
          </label>

          <label class="iu-control" for="clave">
            <span>Contraseña<span class="iu-requerido" aria-hidden="true">*</span></span>
            <div class="iu-clave">
              <input id="clave" name="clave" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres" required aria-describedby="claveAyuda">
              <button type="button" id="verClave" aria-pressed="false">Mostrar</button>
            </div>
            <small class="iu-ayuda" id="claveAyuda"></small>
          </label>

          <label class="iu-interruptor">
            <input type="checkbox" id="recordar" checked>
            <span>Recordar mi email en este equipo</span>
          </label>

          <button class="iu-btn" type="submit">Entrar <kbd class="iu-kbd">↵</kbd></button>
        </form>
      </div>
    </main>
  </div>

  <script src="js/gravelop-iu.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
